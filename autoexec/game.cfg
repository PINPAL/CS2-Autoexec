// Other Game Settings
con_enable              1  // Enable the console (Default: 0)
gameinstructor_enable   0 // Display in-game tutorials for new players (Default: 1)
cl_dm_buyrandomweapons  0 // Spawn with a random weapon in Deathmatch (Default: 1)


// Buy Menu
cl_buywheel_nonumberpurchasing 0 // If set, prevent number keys from purchasing items from the buy menu (Default: 0)
cl_use_opens_buy_menu          0 // If set, pressing the +use key opens buy menu when in buy-zone (disabling allows you to pick up weapons during freeze time) (Default: 1)


// Lobby Privacy
cl_join_advertise                2 // Friends can join without needing an invite (2: All servers, 1: Official servers, 0: None)
ui_setting_advertiseforhire_auto 1 // Show your lobby in "Looking to Play" on game launch (0: Off, 1: Remember Last State, 2: Automatic)


// Team Preferred Color
cl_color 2 // Your preferred color within the team


// Spectating
cl_obs_interp_enable          1  // Smooth camera transition when switching between players during Demo playback or Spectating as an Observer (Default: 1)
mapoverview_allow_client_draw 1  // Allow drawing on the Map Overview (Default: 0)


// Automatic Player Muting
cl_mute_enemy_team                0 // Automatically block all communication from the enemy team and replace their names with colors (Default: 0)
cl_mute_all_but_friends_and_party 0 // Automatically block all communication from players not on your friends list or in your party (0: Disabled, 1: Only in NON-Competitive, 2: Always)


// Privacy
cl_sanitize_player_names   0 // Convert non-friends player names to Yellow/Green/Blue/Orange etc
cl_hide_avatar_images      0 // Hide avatar images of other players (0: Show All, 1: Block All, 2: Block All Except Friends)


// Hold/Toggle Key Behavior
option_duck_method      0 // If set, crouch will toggle when pressed (instead of hold)
option_speed_method     0 // If set, slow walk will toggle when pressed (instead of hold)


// Scope Behavior
cl_sniper_delay_unscope 0 // If set, delay unscoping of AWP/Scout/G3SG1/SCAR-20 after firing (Default: 0)


// When this key is held, purchasing a weapon from the buy menu will drop it for a teammate
cl_buywheel_donate_key 0 // 0: Left Control, 1: Left Alt, 2: Left Shift
