// Sensitivity
sensitivity 0.5 // Mouse Sensitivity (Value of 1.0 Results in 1 DPI physical movement to 1 unit of rotation)
sensitivity_y_scale 1.0 // Multiplier for Y-Axis Sensitivity (eg: 1 = Same as X-Axis, 2 = Double of X-Axis etc)
zoom_sensitivity_ratio 0.818933027098955175 // Scope Sensitivity
                                            // Use 0.818933027098955175 to make small flicks match 1:1 with hipfire
                                            // Source: https://www.reddit.com/r/GlobalOffensive/comments/43urd4/

// Mouse Settings
mouse_inverty  false    // If set, invert Mouse Y-Axis
m_yaw          0.022    // Mouse Yaw Factor (0.022 is default)
m_pitch        0.022    // Mouse Pitch Factor (0.022 is default)