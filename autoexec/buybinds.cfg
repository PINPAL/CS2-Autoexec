// ==================================================================
// Auto Buy Configuration
// ==================================================================
// This is for use with the "autobuy" command
// Buys in order preferring options from left to right depending on money available
cl_autobuy "vesthelm vest weapon_m4a1_silencer ak47 famas weapon_galilar mac10 mp9 defuser"

// ==================================================================
// Grenade Aliases
// ==================================================================
// Equip grenades and also attempt to pick them up and finally buy them if you don't have them 

alias useFlash  "slot7; buy flashbang"
alias useMolly  "slot10;buy incgrenade"
alias useSmoke  "slot8; buy smokegrenade"
alias useHE     "slot6; buy hegrenade"
alias useDecoy  "slot9; buy decoy"

// ==================================================================
// Buy Aliases
// ==================================================================
alias "buyRifle0"    "buy famas"      //  Rifle Slot 0
alias "buyRifle1"    "buy ak47"       //  Rifle Slot 1
alias "buyRifle2"    "buy ssg08"      //  Rifle Slot 2
alias "buyRifle3"    "buy aug"        //  Rifle Slot 3
alias "buyRifle4"    "buy awp"        //  Rifle Slot 4

alias "buyPistol0"   "buy secondary0" //  Pistol Slot 0
alias "buyPistol1"   "buy secondary1" //  Pistol Slot 1
alias "buyPistol2"   "buy p250"		  //  Pistol Slot 2
alias "buyPistol3"   "buy tec9"		  //  Pistol Slot 3
alias "buyPistol4"   "buy deagle"	  //  Pistol Slot 4

alias "buyMidTier0"  "buy midtier0"   //  Mid Tier Slot 0
alias "buyMidTier1"  "buy midtier1"   //  Mid Tier Slot 1
alias "buyMidTier2"  "buy midtier2"   //  Mid Tier Slot 2
alias "buyMidTier3"  "buy midtier3"   //  Mid Tier Slot 3
alias "buyMidTier4"  "buy mp9"		  //  Mid Tier Slot 4

alias "buyVest"      "buy vest"       //  Kevlar Vest
alias "buyVestHelm"  "buy vesthelm"   //  Kevlar Vest & Helmet
alias "buyKit"       "buy defuser"    //  Defuser

alias "donateRifle0"   "buy unused 14 unused0" //  Donate Rifle Slot 1
alias "donateRifle1"   "buy unused 15 unused0" //  Donate Rifle Slot 2
alias "donateRifle2"   "buy unused 16 unused0" //  Donate Rifle Slot 3
alias "donateRifle3"   "buy unused 17 unused0" //  Donate Rifle Slot 4
alias "donateRifle4"   "buy unused 18 unused0" //  Donate Rifle Slot 5

alias "donatePistol0"  "buy unused 2  unused0" //  Donate Pistol Slot 1
alias "donatePistol1"  "buy unused 3  unused0" //  Donate Pistol Slot 2
alias "donatePistol2"  "buy unused 4  unused0" //  Donate Pistol Slot 3
alias "donatePistol3"  "buy unused 5  unused0" //  Donate Pistol Slot 4
alias "donatePistol4"  "buy unused 6  unused0" //  Donate Pistol Slot 5

alias "donateMidTier0" "buy unused 8  unused0" //  Donate Mid Tier Slot 1
alias "donateMidTier1" "buy unused 9  unused0" //  Donate Mid Tier Slot 2
alias "donateMidTier2" "buy unused 10 unused0" //  Donate Mid Tier Slot 3
alias "donateMidTier3" "buy unused 11 unused0" //  Donate Mid Tier Slot 4
alias "donateMidTier4" "buy unused 12 unused0" //  Donate Mid Tier Slot 5

// Alternate Keybinds Handler
alias enableAltKeys  "altKeyRifle0; altKeyRifle1; altKeyRifle2; altKeyRifle3; altKeyRifle4; altKeyPistol2; altKeyPistol3; altKeyPistol4; altKeyMidTier4"
alias disableAltKeys "   keyRifle0;    keyRifle1;    keyRifle2;    keyRifle3;    keyRifle4;    keyPistol2;    keyPistol3;    keyPistol4;    keyMidTier4"
// Enable Alternate Keybinds & Inspect Weapon while holding "+altKeys" bind
alias +altKeys "enableAltKeys ;+lookatweapon"
alias -altKeys "disableAltKeys;-lookatweapon"

// ==================================================================
// KEYBINDS
// ==================================================================

bind   J  buyVest       //  J            Buy Kevlar Vest
bind   U  buyVestHelm   //  U            Buy Kevlar & Helmet
bind   M  buyKit        //  M            Buy Defuser Kit

// ==================================================================
// ALTERNATE KEYBINDS
// Alternate Buybinds while holding '+altKeys' bind
// Drops for team instead of buying for yourself
// ==================================================================
bind    MOUSE4          "+altKeys"                       //  Mouse4      Inspect Weapon & Hold for Alternate Buybinds

// Default Keys (NOT holding button)
alias   keyRifle0      "bind SEMICOLON   buyRifle0"      // Semicolon    Buy Rifle Slot 0 
alias   keyRifle1      "bind L           buyRifle1"      // L            Buy Rifle Slot 1
alias   keyRifle2      "bind K  		 buyRifle2"      // K            Buy Rifle Slot 2
alias   keyRifle3      "bind I  		 buyRifle3"      // I            Buy Rifle Slot 3
alias   keyRifle4      "bind O  		 buyRifle4"      // O            Buy Rifle Slot 4
//alias keyPistol0     "bind scancode229 buyPistol0"     // Right Shift  Buy Pistol Slot 0
//alias keyPistol1     "bind scancode229 buyPistol1"     // Right Shift  Buy Pistol Slot 1
alias   keyPistol2     "bind P  		 buyPistol2"     // P            Buy Pistol Slot 2
alias   keyPistol3     "bind ,  		 buyPistol3"     // Comma <,     Buy Pistol Slot 3
alias   keyPistol4     "bind /  		 buyPistol4"     // Slash ?/     Buy Pistol Slot 4
//alias keyMidTier0    "bind scancode229 buyMidTier0"    // Right Shift  Buy Mid Tier Slot 0
//alias keyMidTier1    "bind scancode229 buyMidTier1"    // Right Shift  Buy Mid Tier Slot 1
//alias keyMidTier2    "bind scancode229 buyMidTier2"    // Right Shift  Buy Mid Tier Slot 2
//alias keyMidTier3    "bind scancode229 buyMidTier3"    // Right Shift  Buy Mid Tier Slot 3
alias   keyMidTier4    "bind .  		 buyMidTier4"    // Period >.    Buy Mid Tier Slot 4

// Alternate Keys (HOLDING button)
alias   altKeyRifle0   "bind SEMICOLON   donateRifle0"   // Semicolon    Drop Rifle Slot 0
alias   altKeyRifle1   "bind L           donateRifle1"   // L            Drop Rifle Slot 1
alias   altKeyRifle2   "bind K  		 donateRifle2"   // K            Drop Rifle Slot 2
alias   altKeyRifle3   "bind I  		 donateRifle3"   // I            Drop Rifle Slot 3
alias   altKeyRifle4   "bind O  		 donateRifle4"   // O            Drop Rifle Slot 4
//alias altKeyPistol0  "bind scancode229 donatePistol0"  // Right Shift  Drop Pistol Slot 0
//alias altKeyPistol1  "bind scancode229 donatePistol1"  // Right Shift  Drop Pistol Slot 1
alias   altKeyPistol2  "bind P  		 donatePistol2"  // P            Drop Pistol Slot 2
alias   altKeyPistol3  "bind ,  		 donatePistol3"  // Comma <,     Drop Pistol Slot 3
alias   altKeyPistol4  "bind /  		 donatePistol4"  // Slash ?/     Drop Pistol Slot 4
//alias altKeyMidTier0 "bind scancode229 donateMidTier0" // Right Shift  Drop Mid Tier Slot 0
//alias altKeyMidTier1 "bind scancode229 donateMidTier1" // Right Shift  Drop Mid Tier Slot 1
//alias altKeyMidTier2 "bind scancode229 donateMidTier2" // Right Shift  Drop Mid Tier Slot 2
//alias altKeyMidTier3 "bind scancode229 donateMidTier3" // Right Shift  Drop Mid Tier Slot 3
alias   altKeyMidTier4 "bind .  		 donateMidTier4" // Period >.    Drop Mid Tier Slot 4

// Apply Default Keybinds
disableAltKeys