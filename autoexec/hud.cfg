// HUD Size & Position
alias setSafeZoneX "safezonex 1.0"	  // HUD left & right inset from the screen edge (Default: 1) (0.666 gives 4:3 on 16:9)
alias setSafeZoneY "safezoney 0.85"	  // HUD top & bottom inset from the screen edge (Default: 1)
alias setHudScale  "hud_scaling 0.75" // Size multiplier for the entire HUD (Min 0.9 | Max 1.1 | Default: 1)


// HUD Appearance
cl_hud_background_alpha    	 0 // Background opacity behind HUD text/elements
cl_hud_color 				 1 // The color of your Ammo Counter/Health Bar/Buy Menu etc
cl_hud_playercount_showcount 1 // Replace currently alive player avatars at the top of screen with a number while the round is active


// Hide HUD Elements
hidehud                    0 // Hide elements of the HUD using a bitmask (0: None, 1: Weapon Selection, 2: Flashlight, 4: All, 8: Health, 16: Player Dead, 32: Needssuit, 64: Misc, 128: Chat, 256: Crosshair, 512: Vehicle Crosshair, 1024: In Vehicle)
cl_draw_only_deathnotices  0 // If set, show ONLY the kill feed and crosshair
cl_autohelp                0 // If set, present popup tutorial hints designed for new players
hud_showtargetid           1 // If set, aiming at an enemy displays their name in red text below crosshair
cl_showloadout             1 // If set, always show your current weapons INSTEAD of only when switching between them 


// Teammates Overhead Information
cl_drawhud_force_teamid_overhead       1    // Display teammates information above their heads even if the HUD is disabled (0: Only if HUD is enabled, 1: Always, -1: Never)
cl_teamid_overhead_mode                3    // Controls what information is shown in teammates overhead (0: Disabled, 1: Arrow, 2: Arrow & Player Name, 3: Arrow & Player Name & Equipment)
cl_teamid_overhead_maxdist             6000 // Maximum distance which teammates overhead info shows above their heads
cl_teamid_overhead_maxdist_spec        6000 // Maximum distance which teammates overhead info shows above their heads WHEN YOU are spectating


// Pings
cl_ping_fade_deadzone       60   // Distance from the crosshair which pings will be completely invisible
cl_ping_fade_distance       300  // Distance from the crosshair which pings begin to fade


// Steam Overlay Notifications
ui_steam_overlay_notification_position topright // Position of Steam overlay notifications (topright | bottomleft)


// Telemetry Stats & Graphs
cl_showfps		0   // Show Map Name & FPS counter on top LEFT (0: None, 1: FPS, 2: Detailed FPS, 3: Server MS, 4: FPS & Log to file)
net_graph		0	// Enable the FPS & network telemetry indicator 
net_graphpos	2	// Position of netgraph (0: Right, 1: Left, 2: Center)


// Radar
cl_drawhud_force_radar          0      // Show Radar ( 0: Default | 1: Draw Radar even if HUD is Disabled | -1: Force No Radar)
cl_hud_radar_scale              1.3    // Physical size of the radar on the HUD (Min 0.8 | Max 1.3 | Default: 1.0)
cl_radar_always_centered        0  // If set, force the player to always be in the center of the radar - can waste space when you are near the edge of the map
cl_radar_rotate                 1   // If set, the radar rotates such that the direction you are facing is always up
cl_radar_square_with_scoreboard 1   // If set, the radar will toggle to square when the scoreboard is visible
cl_radar_scale                  0.325  // Zoom multiplier for the radar (higher values = MORE zoom) (Min 0.25 | Max 1 | Default: 0.7)
cl_radar_icon_scale_min         0.4    // Set the minimum size of the icons like players (Min 0.4 | Max 1.25 | Default: 0.6)
cl_teammate_colors_show         2      // Show letters inside teammates colored dots on the radar (1: Colored dots only, 2: Colored dots with the first letter of color inside)


// Fullscreen HUD & show net_graph within team when scoreboard is open
alias +scorenet "+showscores;hud_scaling 1.00;safezonex 1 ;safezoney 1 ;net_graph 1"
alias -scorenet "-showscores;setHudScale     ;setSafeZoneX;setSafeZoneY;net_graph 0"


// Apply Default HUD Settings
setSafeZoneX;setSafeZoneY;setHudScale