// HUD Size & Position
alias setSafeZoneX "safezonex 0.666" // HUD left & right inset from the screen edge (Default: 1) (0.666 gives 4:3 on 16:9)
alias setSafeZoneY "safezoney 0.7"   // HUD top & bottom inset from the screen edge (Default: 1)
alias setHudScale  "hud_scaling 0.9" // Size multiplier for the entire HUD (Min 0.9 | Max 1.1 | Default: 1)


// Hide HUD Elements
hidehud                    0     // Hide elements of the HUD using a bitmask (0: None, 1: Weapon Selection, 2: Flashlight, 4: All, 8: Health, 16: Player Dead, 32: Needssuit, 64: Misc, 128: Chat, 256: Crosshair, 512: Vehicle Crosshair, 1024: In Vehicle)
cl_showpos                 0     // Show position, velocity & stamina debug overlay (Requires sv_cheats) (0: Off | 1: On)
cl_draw_only_deathnotices  false // If set, show ONLY the kill feed and crosshair
r_show_build_info          false // If set, show game build version in bottom left
cl_autohelp                false // If set, present popup tutorial hints designed for new players
hud_showtargetid           true  // If set, aiming at an enemy displays their name in red text below crosshair
cl_showloadout             false // If set, always show your current weapons INSTEAD of only when switching between them (NOTE: Grenades are ALWAYS shown regardless of this setting)


// Player Alive Counter
cl_teamcounter_playercount_instead_of_avatars true // Replace currently alive player avatars at the top of screen with a number while the round is active


// HUD Color
alias setHudColor "cl_hud_color 2" // The color of your Ammo Counter/Health Bar/Buy Menu etc
// Options Range from 0 to 12, 0 and 12 are dynamic while 1-11 are static as follows:
//      0: Your current Teams Color (Blue on CT Side, Orange on T Side)
//      1: White, 2: Bright White, 3: Light Blue, 4: Blue, 5: Purple, 6: Red, 7: Orange, 8: Yellow, 9: Green, 10: Aqua, 11: Pink
//     12: Your color within the Team (Green, Yellow, Orange, Blue, Purple)


// Teammates Overhead Information
cl_drawhud_force_teamid_overhead       1    // Display teammates information above their heads even if the HUD is disabled (0: Only if HUD is enabled, 1: Always, -1: Never)
cl_teamid_overhead_mode                3    // Controls what information is shown in teammates overhead (0: Disabled, 1: Arrow, 2: Arrow & Player Name, 3: Arrow & Player Name & Equipment)
cl_teamid_overhead_colors_show         true // If set, teammates overhead info is colored to match their color within the team

cl_teamid_overhead_fade_near_crosshair 0.50 // Opacity to to fade teammates overhead info fades to when near the crosshair (Range is 0.0-1.0)
cl_teamid_overhead_maxdist             6000 // Maximum distance which teammates overhead info shows above their heads
cl_teamid_overhead_maxdist_spec        6000 // Maximum distance which teammates overhead info shows above their heads WHEN YOU are spectating


// Pings
cl_ping_fade_deadzone       60   // Distance from the crosshair which pings will be completely invisible
cl_ping_fade_distance       300  // Distance from the crosshair which pings begin to fade


// Steam Overlay Notifications
ui_steam_overlay_notification_position       topright // Position of Steam overlay notifications (topright | bottomleft)
ui_steam_overlay_notification_position_horz  0        // Steam overlay notification position horizontal offset
ui_steam_overlay_notification_position_vert  0        // Steam overlay notification position vertical offset


// Telemetry Stats & Graphs
cl_showfps                                   0   // Show Map Name & FPS counter on top LEFT (0: None, 1: FPS, 2: Detailed FPS, 3: Server MS, 4: FPS & Log to file)
cl_hud_telemetry_frametime_show              2   // Show FPS and Frametime on top RIGHT (0 = Never, 1 = Only if poor, 2 = Always)
cl_hud_telemetry_frametime_poor              20  // Frametime (in ms) greater than this value will be considered poor

cl_hud_telemetry_ping_show                   2   // Show ping on top right (0: Never, 1: Only if poor, 2: Always)
cl_hud_telemetry_ping_poor                   80  // Ping (in ms) greater than this value will be considered poor

cl_hud_telemetry_net_quality_graph_show      0   // Show packet loss/jitter graph on top right (0: Never, 1: Only if poor, 2: Always)
cl_hud_telemetry_serverrecvmargin_graph_show 0   // Show graph in top right of how early/late user commands are arriving at the server before they are executed (0: Never, 1: Only if poor, 2: Always)


// Radar
cl_drawhud_force_radar          0      // Show Radar ( 0: Default | 1: Draw Radar even if HUD is Disabled | -1: Force No Radar)
cl_hud_radar_scale              1.3    // Physical size of the radar on the HUD (Min 0.8 | Max 1.3 | Default: 1.0)
cl_radar_always_centered        false  // If set, force the player to always be in the center of the radar - can waste space when you are near the edge of the map
cl_radar_rotate                 true   // If set, the radar rotates such that the direction you are facing is always up

cl_radar_square_always          false  // If set, the radar will always be square (when enabled, also won't rotate)
cl_radar_square_with_scoreboard true   // If set, the radar will toggle to square when the scoreboard is visible

cl_hud_radar_blur_background    false  // If set, blur the empty background space of the radar
cl_hud_radar_map_additive       false  // If set, blend radar map geometry color additively with the background
cl_hud_radar_background_alpha   0      // Opacity of the radar background (Min 0.0 | Max 1.0 | Default: 0.627)

cl_radar_scale_dynamic          false  // Dynamically zoom the radar based on teammates positions and spotted enemies visible on radar
cl_radar_scale                  0.35   // Zoom multiplier for the radar (higher values = MORE zoom) (Min 0.25 | Max 1 | Default: 0.7)
cl_radar_scale_alternate        1.0    // Zoom multiplier applied to the radar WHEN "toggleradarscale" keybind is pressed (Min 0.25 | Max 1.0 | Default: 1.0)

cl_radar_icon_scale_min         0.4    // Set the minimum size of the icons like players (Min 0.4 | Max 1.25 | Default: 0.6)
cl_teammate_colors_show         2      // Show letters inside teammates colored dots on the radar (1: Colored dots only, 2: Colored dots with the first letter of color inside)


// Fullscreen HUD & match color within team when scoreboard is open
alias +scorenet "+showscores;hud_scaling 1.00;safezonex 1 ;safezoney 1 ;cl_hud_color 12"
alias -scorenet "-showscores;setHudScale     ;setSafeZoneX;setSafeZoneY;setHudColor"


// Apply Default HUD Settings
setSafeZoneX;setSafeZoneY;setHudScale;setHudColor