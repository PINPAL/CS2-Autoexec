// Volume
volume                      0.005 // MASTER VOLUME
voice_scale                 0.400 // Team voice chat volume
snd_deathcamera_volume      0.000 // Sound effect volume that plays during the Deathmatch death camera
snd_mapobjective_volume     0.000 // Music volume that plays when a bomb is planted
snd_menumusic_volume        0.000 // Main menu music volume
snd_roundend_volume         0.000 // Music volume that plays when a round ends
snd_roundstart_volume       0.000 // Music volume that plays when a round starts
snd_mvp_volume              0.000 // MVP Music Disc volume that plays after a round ends
snd_tensecondwarning_volume 0.000 // Music volume played when the bomb is 9.7 seconds away from exploding

// Sound Sources
voice_modenable                 1  // Enable team voice chat (Default: 1)
snd_mute_losefocus              1  // Mute the game when alt-tabbed (Default: 1)
snd_mute_mvp_music_live_players 0 // Mute MVP Music if there are still live players on both teams (Default: 0)
voice_loopback                  0 // Play the sound from your microphone back to you (Default: 0)
cl_player_ping_mute             0     // Mute the sound effect of a player pinging a location (0: Sound Enabled, 1: Muted)

// ==================================================================
// Sound Effects
// ==================================================================
alias blipMidSFX "playvol buttons\blip1 0.4"
alias blipMaxSFX "playvol buttons\blip2 0.4"
alias blipLowSFX "playvol ui\beep07 0.4"
alias chickenSFX "playvol ambient\creatures\chicken_panic_04 0.4"
alias scrollSFX  "playvol ui\csgo_ui_page_scroll 0.4"
alias clickSFX   "playvol ui\buttonclickrelease 0.4"
alias flushSFX   "playvol ambient\misc\flush1 0.4"
alias btnRollSFX "playvol ui\buttonrollover 0.4"
alias latchSFX   "playvol buttons\latchunlocked2 0.4"
alias throwSFX   "playvol weapons\decoy\grenade_throw 0.4"
alias scopeSFX   "playvol weapons\awp\zoom 0.4"
alias pickupSFX  "playvol ui\panorama\pickup_dropped_weapon 0.4"

// ==================================================================
// Volume Level Up/Down Buttons
// ==================================================================
alias volumeUp   "volume2" // Volume Up Button
alias volumeDown "volume0" // Volume Down Button

alias volume0 "volume 0.000;                               alias volumeUp volume1; alias volumeDown volume0" // Preset 0: Mute
alias volume1 "volume 0.005;blipLowSFX;alias volumeUp volume2; alias volumeDown volume0" // Preset 1: Default Volume on Launch
alias volume2 "volume 0.100;blipMidSFX;alias volumeUp volume3; alias volumeDown volume1" // Preset 2: Low Volume for Warmup
alias volume3 "volume 0.250;blipMidSFX;alias volumeUp volume4; alias volumeDown volume2" // Preset 3: Medium Volume for Casual Play
alias volume4 "volume 0.400;blipMaxSFX;alias volumeUp volume4; alias volumeDown volume3" // Preset 4: High Volume for Competitive

// ==================================================================
// Voice Chat Toggle
// ==================================================================
alias voiceChatOn  "voice_modenable 1;alias vcToggle voiceChatOff;chickenSFX"
alias voiceChatOff "voice_modenable 0;alias vcToggle voiceChatOn ;scrollSFX"
alias vcToggle "voiceChatOff"