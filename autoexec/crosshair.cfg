// Crosshair Style
cl_crosshairstyle 4 // Crosshair Style (Min:0 | Max:5)
    //    | Style                   | Firing Error | Movement Error |
    //    |-------------------------|--------------|----------------|
    //  0 | Dynamic Cross           | Yes          | Yes            |
    //  1 | Dynamic Circle          | Yes          | Yes            |
    //  2 | Dynamic Cross (Classic) | Yes          | Yes            | Note: Visually appears as two individual crosshairs
    //  3 | Static Circle           | No           | No             |
    //  4 | Static Cross            | No           | No             |
    //  5 | Dynamic Cross (Legacy)  | Yes          | No             | Note: Transitions between two crosshairs gap values
    //  6 | Dot Only                | No           | No             |
    //  7 | Dynamic Quad            | Yes          | Yes            | Note: Visually appears as static cross + four circular corners
    //    -----------------------------------------------------------

cl_crosshair_recoil            true  // Crosshair moves from the middle of the screen to the next shot location when firing
cl_crosshair_t                 false // Use of a "T" shaped crosshair rather than regular "+"
cl_crosshair_drawoutline       0     // Show black outline around crosshair (0: Disabled, 1: Enabled, 2: Left & Top Only)
cl_crosshair_friendly_warning  1     // Draw a transparent crossed out circle ⨂ behind the crosshair when aiming at teammate (0: Off, 1: On)

// Default Crosshair Settings
alias cThick "cl_crosshair_thickness 2"     // Thickness (width) of crosshair lines
alias cGap   "cl_crosshair_gap       0"     // Gap between crosshair dot and lines
alias cSize  "cl_crosshair_length    2"     // Length of the crosshair lines
alias cDot   "cl_crosshairdot        false" // Show a center square in middle of crosshair

// Color & Opacity
cl_crosshaircolor_r 255
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0
cl_crosshaircolor_a 255


// ==================================================================
// ! Specific to Styles 0, 1, 5 and 7 (Dynamic)
// ==================================================================
cl_crosshair_dynamic_spread_limit 0 // The additional distance the dynamic elements are allowed to spread out to from the baseline of 128 pixels. [0 - 255]


// ==================================================================
// ! Specific to Style 2
// ==================================================================
cl_crosshair_dynamic_maxdist_splitratio  0.9 // How the bar length is divided between inner and outer bars once split. inner = cl_crosshairsize * (1 - ratio), outer = cl_crosshairsize * ratio. [0 - 1]
cl_crosshair_dynamic_splitdist           3   // Distance at which the crosshair bars split in two.
cl_crosshair_dynamic_splitalpha_outermod 0.5 // Alpha multiplier for the OUTER crosshair bars once they have split. [0.3 - 1]
cl_crosshair_dynamic_splitalpha_innermod 1.0 // Alpha multiplier for the INNER crosshair bars once they have split. [0 - 1]


// ==================================================================
// ! Scoped & Sniper Crosshairs
// ==================================================================

// AWP, SSG08, G3SG1, SCAR-20 Crosshair 
cl_crosshair_sniper_width      2     // Thickness (width) of scoped crosshair
cl_sniper_show_inaccuracy      false // Show inaccuracy mini-crosshair 

// AUG, SG 553 Reticle Dot
cl_ironsight_usecrosshaircolor true  // Use the normal crosshair color for the scope reticle dot color
cl_ironsight_dot_scale         0.75  // Size of the scope reticle dot


// ==================================================================
// ! Spectating
// ==================================================================
cl_show_observer_crosshair     2    // Show other players crosshairs when spectating (0: Off, 1: Friends and Party, 2: Everyone)
cl_observed_bot_crosshair      2    // Control the crosshair shown when observing a bot (0: Show player crosshair, 1: Show player crosshair only when bot can be taken over, otherwise show default, 2: Always show default crosshair for bots)


// ==================================================================
// ! Grenade Crosshairs
// ==================================================================

// Grenade Crosshair
cl_grenadecrosshair_keepusercrosshair    false // Keep the user's crosshair when the grenade crosshair is enabled (Default: true)
cl_grenadecrosshair_decoy                true  // Show the grenade lineup crosshair for Decoys
cl_grenadecrosshair_explosive            true  // Show the grenade lineup crosshair for HE Grenades
cl_grenadecrosshair_fire                 true  // Show the grenade lineup crosshair for Molotovs
cl_grenadecrosshair_flash                true  // Show the grenade lineup crosshair for Flashes
cl_grenadecrosshair_smoke                true  // Show the grenade lineup crosshair for Smokes
cl_grenadecrosshairdelay_decoy           0     // Decoy      Time in seconds the pin must be pulled for before showing grenade crosshair (Default: 2)
cl_grenadecrosshairdelay_explosive       0     // HE Grenade Time in seconds the pin must be pulled for before showing grenade crosshair (Default: 2)
cl_grenadecrosshairdelay_fire            0     // Molotov    Time in seconds the pin must be pulled for before showing grenade crosshair (Default: 2)
cl_grenadecrosshairdelay_flash           0     // Flash      Time in seconds the pin must be pulled for before showing grenade crosshair (Default: 2)
cl_grenadecrosshairdelay_smoke           0     // Smoke      Time in seconds the pin must be pulled for before showing grenade crosshair (Default: 2)

// CUSTOM Grenade Crosshair
// Used to show a custom crosshair such that you can lineup during buy time (as pin cannot be pulled for the built-in grenade crosshair)
alias cgThick "cl_crosshair_thickness 1"     // Thickness (width) of crosshair lines
alias cgGap   "cl_crosshair_gap       8"     // Gap between crosshair dot and lines
alias cgSize  "cl_crosshair_length    255"   // Length of the crosshair lines
alias cgDot   "cl_crosshairdot        true"  // Show a center square in middle of crosshair


// ==================================================================
// ! Aliases
// ==================================================================

// Toggle default/grenade crosshairs
alias crosshairDefault "cThick;  cGap; cSize; cDot"
alias crosshairGrenade "cgThick;cgGap;cgSize;cgDot"

// Toggling grenade crosshair on and off with a key
alias grenadeCrosshairOn  "crosshairGrenade;alias togNadeCross grenadeCrosshairOff"
alias grenadeCrosshairOff "crosshairDefault;alias togNadeCross grenadeCrosshairOn"
alias togNadeCross "grenadeCrosshairOn"

// Toggling crosshair recoil on and off
alias recoilShow "cl_crosshair_recoil 1"
alias recoilHide "cl_crosshair_recoil 0"
alias recoilCrosshairOn  "alias recoilShow cl_crosshair_recoil 1"
alias recoilCrosshairOff "alias recoilShow cl_crosshair_recoil 0"

// Enable crosshair recoil while holding shoot key then disable it on key release
// Also disables grenade crosshair when key is released
alias +attackReset "+attack;recoilShow;spec_next"
alias -attackReset "-attack;recoilHide;crosshairDefault"

// Disable grenade crosshair when releasing attack2 key
alias +attack2Reset "+attack2"
alias -attack2Reset "-attack2;crosshairDefault"

// Set various crosshair settings based on weapon slot
alias slotOne    "slot1; crosshairDefault;recoilCrosshairOn "
alias slotTwo    "slot2; crosshairDefault;recoilCrosshairOff"
alias slotThree  "slot3; crosshairDefault"
alias slotFour   "slot4; crosshairGrenade"
alias slotFive   "slot5; crosshairDefault"
alias slotTwelve "slot12;crosshairDefault"
alias dropReset  "drop;  crosshairDefault"
alias flashCross "useFlash;crosshairGrenade"
alias mollyCross "useMolly;crosshairGrenade"
alias smokeCross "useSmoke;crosshairGrenade"
alias heCross    "useHE;   crosshairGrenade"
alias decoyCross "useDecoy;crosshairGrenade"

// Aliases to quickly enable crosshair presets
alias "x"   "alias cGap cl_crosshair_gap 4;alias cSize cl_crosshair_length 5"  // Enable Cross Crosshair  +
alias "o"   "alias cGap cl_crosshair_gap 0;alias cSize cl_crosshair_length 2"  // Enable Dot   Crosshair  •

// Apply default crosshair settings on autoexec execution
crosshairDefault