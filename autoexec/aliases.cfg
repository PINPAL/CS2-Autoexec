// Quick Switch - Equip Knife when holding key and swap back to best weapon upon release
// Enables left handed viewmodel for knife
// Returns to right Handed viewmodel for other weapons
alias +knife "switchhandsleft; slot3;crosshairDefault"
alias -knife "switchhandsright;slot2;slot1;recoilCrosshairOn"

// Noclip Alias
alias cleanNoclipHint "ent_fire hint_noclip kill"
alias spawnNoclipHint "ent_create env_hudhint {message Toggled No Clip targetname hint_noclip}"
alias displayNoclipHint "ent_fire hint_noclip showhudhint"
alias toggleNoclip "noclip;clickSFX;spawnNoclipHint;displayNoclipHint;cleanNoclipHint"

// Jump Throw
alias "jat" "+!attack;+!attack2"
alias "+jt" "-!jump;jat"
alias "-jt" "+!jump"
alias "+wjt" "-!forward; +jt;enable_reset_JT"
alias "-wjt" "+!forward; -jt"
// Reset movement action when switching to knife after W jumpthrow bind
alias enable_reset_JT "alias reset_JT_0 reset_JT_1"
alias disable_reset_JT "alias reset_JT_0"
alias reset_JT_0;
alias reset_JT_1 "-forward; bind mouse_x reset_JT_2"
alias reset_JT_2 "-jump; bind mouse_x yaw;disable_reset_JT"

// Console Shortcuts for Custom Knives (Requires sv_cheats 1)
alias "knife" "exec knifeMenu"

// Quick Shortcuts for Console
alias "ae"      "exec autoexec"
alias "q"       "quit"
alias "dc"      "disconnect;hideconsole"
alias "rg"      "mp_restartgame 1;hideconsole"
alias "prac"    "exec gamemodes/practice"
alias "bhop"    "exec gamemodes/bhop"
alias "kz"      "exec gamemodes/kz"
alias "lkz"     "exec gamemodes/vanilla_kz"
alias "vv"      "exec gamemodes/1v1"
alias "uidemo"  "exec gamemodes/demo_viewer"
alias "comp"    "exec gamemodes/competitive"
alias "ctb"     "bot_add_ct"
alias "tb"      "bot_add_t"
alias "pb"      "bot_place"
