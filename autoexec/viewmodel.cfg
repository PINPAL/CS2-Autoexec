// Viewmodel
cl_righthand		 1    // Default viewmodel is right handed (true) or left handed (false)
viewmodel_presetpos  1    // Basic preset of viewmodel position (1: Desktop, 2: Couch, 3: Classic)
viewmodel_fov        68   // (Min 54  | Max 68)  Distance of weapon from the players eyes
viewmodel_offset_x   2.5  // (Min -2  | Max 2.5) Distance of weapon from the side of the screen
viewmodel_offset_y   2    // (Min -2  | Max 2)   Distance of weapon from the camera 
viewmodel_offset_z   -2   // (Min -2  | Max 2)   Distance of weapon is from the bottom of the screen

cl_bob_lower_amt    5 	  // (Min 5   | Max 30)  The amount the viewmodel lowers when running
cl_bobamt_lat       0.1   // (Min 0.1 | Max 2)   The amount the viewmodel moves side to side when running
cl_bobamt_vert      0.1   // (Min 0.1 | Max 2)   The amount the viewmodel moves up and down when running
cl_bobcycle         0     // (Min 0.1 | Max 2)   The frequency at which the viewmodel bobs.